name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all --benches --tests --examples --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Check the generated API contract
        run: |
          cargo run --locked --bin closet -- --openapi /tmp/closet-openapi.json
          cmp openapi/api.json /tmp/closet-openapi.json
      - run: cargo run --locked --bin ha-closet -- inventory validate --input config/catalog.example.json
      - run: cargo run --locked --bin ha-closet -- inventory validate --input config/wardrobe.example/wardrobe.toml

  home-assistant:
    name: Home Assistant
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked --bins
      - run: uv sync --frozen
      - run: uv run --frozen ruff check custom_components tests_ha tests_web scripts
      - run: uv run --frozen ruff format --check custom_components tests_ha tests_web scripts
      - run: uv run --frozen ty check --error-on-warning custom_components tests_ha tests_web
      - run: uv run --frozen pytest tests_ha
        env:
          CLOSET_TEST_BINARY: ${{ github.workspace }}/target/debug/closet

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked --bin closet
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest tests_web
        env:
          CLOSET_TEST_BINARY: ${{ github.workspace }}/target/debug/closet

  repository:
    name: Repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/check-public-tree
      - run: scripts/check-release-version
      - run: sh -n docker-entrypoint.sh
      - run: bash -n scripts/container-smoke.sh
      - run: shellcheck docker-entrypoint.sh scripts/container-smoke.sh
