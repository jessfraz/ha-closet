name: CLI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools
      - run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build CLI
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --bin ha-closet --target "$TARGET"
      - name: Exercise the released binary offline
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/ha-closet" --version
          "target/$TARGET/release/ha-closet" inventory validate --input config/catalog.example.json
          "target/$TARGET/release/ha-closet" inventory validate --input config/wardrobe.example/wardrobe.toml
          "target/$TARGET/release/ha-closet" tracking config validate --input config/tracking.example.json
          "target/$TARGET/release/ha-closet" tracking replay --input config/tracking-replay.example.json
          "target/$TARGET/release/ha-closet" inventory validate \
            --input tests/fixtures/image-policy/catalog.json \
            --image-manifest tests/fixtures/image-policy/manifest.json \
            --images tests/fixtures/image-policy/images > "$RUNNER_TEMP/image-policy.json"
          python3 - "$RUNNER_TEMP/image-policy.json" <<'PY'
          import json, sys
          from pathlib import Path
          actual = json.loads(Path(sys.argv[1]).read_text())["data"]["images"]
          expected = json.loads(Path("tests/fixtures/image-policy/expected.json").read_text())
          assert actual == expected, (actual, expected)
          PY
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/ha-closet-$TARGET.tar.gz" -C "target/$TARGET/release" ha-closet
          python3 - "$TARGET" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path('dist') / ('ha-closet-' + sys.argv[1] + '.tar.gz')
          path.with_suffix(path.suffix + '.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish CLI assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Attach tested binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$REPOSITORY"
