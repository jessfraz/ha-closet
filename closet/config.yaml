name: Closet
version: "0.4.10"
slug: closet
description: A wardrobe inventory with an optional outfit lottery
url: https://github.com/jessfraz/ha-closet
arch:
  - amd64
  - aarch64
image: ghcr.io/jessfraz/ha-closet
startup: application
boot: auto
backup: cold
timeout: 120
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:hanger
homeassistant_api: true
hassio_api: true
hassio_role: default
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Optional bearer-authenticated API; not needed for HA-backed clients
environment:
  CLOSET_ENABLE_INGRESS: "true"
options:
  timezone: UTC
  weather_entity: ""
  ai_task_entity: ""
schema:
  timezone: str
  weather_entity: str
  ai_task_entity: str
discovery:
  - closet
