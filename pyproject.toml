[project]
name = "closet-home-assistant"
version = "0.4.7"
description = "Home Assistant adapter for the Closet inventory"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "gazetteer-matcher==1.2.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.27",
  "playwright==1.64.1",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.17.3",
  "ty==0.0.97",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_ha", "tests_web"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]

[tool.ruff.per-file-target-version]
"scripts/*" = "py312"

[tool.ty.src]
include = ["custom_components", "tests_ha", "tests_web"]

[tool.uv]
package = false
