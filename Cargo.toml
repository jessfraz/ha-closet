[package]
name = "closet"
version = "0.4.7"
edition = "2024"
license = "MIT"
description = "A wardrobe inventory for Home Assistant"
repository = "https://github.com/jessfraz/ha-closet"
default-run = "closet"

[[bin]]
name = "closet"
path = "src/main.rs"

[[bin]]
name = "ha-closet"
path = "src/bin/ha-closet.rs"

[dependencies]
ha-app-ui = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.2" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.18"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
icu_casemap = "2.4"
icu_normalizer = "2.4"
icu_properties = "2.4"
http = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
moxcms = "=0.8.1"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
# Temporary upstream pin: registry 0.9.0 excludes the SQLite fix for RUSTSEC-2026-0459.
# Return to a registry release once it permits libsqlite3-sys >=0.39.0.
sqlx = { version = "0.9", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1"
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
